<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Literarische Karte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink: #1a1208; --bg: #f7f5f2; --surface: #ffffff; --muted: #6b6560; --border: #ddd9d4; --accent: #c45a18; --radius: 8px; }
  html, body { height: 100%; font-family: sans-serif; background: var(--bg); color: var(--ink); overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 1000; }
  #toolbar h1 { font-size: 16px; flex: 1; }
  .tbtn { font-size: 12px; padding: 5px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: #fff; cursor: pointer; }
  #main { display: flex; flex: 1; overflow: hidden; }
  #sidebar { width: 320px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
  .tab.on { color: var(--ink); border-bottom: 2px solid var(--accent); }
  #panel { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
  .fg { display: flex; flex-direction: column; gap: 4px; }
  .lbl { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  input, textarea { padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); font-family: inherit; font-size: 13px; }
  .save-btn { background: var(--ink); color: white; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  #mapwrap { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; background: #e0e0e0; }
  .book-item { padding: 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; position: relative; background: #fff; margin-bottom: 8px; }
  .delbtn { position: absolute; top: 5px; right: 8px; color: #ccc; cursor: pointer; background: none; border: none; font-size: 18px; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>Literarische <span>Karte</span></h1>
    <button class="tbtn" onclick="exportData()">Export</button>
    <label class="tbtn">Import<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
  </div>
  <div id="main">
    <div id="sidebar">
      <div id="tabs">
        <div class="tab on" id="tab-list" onclick="switchTab('list')">Bücher</div>
        <div class="tab" id="tab-add" onclick="switchTab('add')">+ Hinzufügen</div>
      </div>
      <div id="panel"></div>
    </div>
    <div id="mapwrap"><div id="map"></div></div>
  </div>
</div>

<script>
const map = L.map('map').setView([51.16, 10.45], 5);
// Nutze CartoDB Tiles (oft kulanter bei lokalem Testen)
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

let books = JSON.parse(localStorage.getItem('litKarte_v1') || '[]');
let tab = 'list', picking = false, pickedLocs = [];
const markers = {};

function renderAllMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  books.forEach(book => {
    book.locations.forEach(loc => {
      const m = L.marker([loc.lat, loc.lng]).addTo(map);
      m.bindPopup(`<b>${book.title}</b><br>${book.author}`);
      markers[book.id + loc.lat] = m;
    });
  });
}

function renderSidebar() {
  const p = document.getElementById('panel');
  if (tab === 'list') {
    p.innerHTML = books.length ? books.map(b => `
      <div class="book-item" onclick="zoomTo('${b.id}')">
        <strong>${b.title}</strong><br><small>${b.author}</small>
        <button class="delbtn" onclick="event.stopPropagation(); deleteBook('${b.id}')">×</button>
      </div>`).join('') : '<p>Noch keine Bücher.</p>';
  } else {
    p.innerHTML = `
      <div class="fg"><label class="lbl">Titel</label><input id="fTitle" type="text"></div>
      <div class="fg"><label class="lbl">Autor</label><input id="fAuthor" type="text"></div>
      <div class="fg"><button class="tbtn" onclick="picking=true; renderSidebar();">Ort auf Karte wählen</button>
      <small>${picking ? '⏳ Klicke jetzt in die Karte' : (pickedLocs.length ? '✅ Ort gewählt' : '')}</small></div>
      <button class="save-btn" onclick="save()">Speichern</button>`;
  }
}

map.on('click', e => {
  if (!picking) return;
  pickedLocs = [{lat: e.latlng.lat, lng: e.latlng.lng}];
  picking = false;
  renderSidebar();
});

function save() {
  const t = document.getElementById('fTitle').value;
  if (!t || !pickedLocs.length) return alert("Titel und Ort fehlen!");
  books.push({ id: Date.now().toString(), title: t, author: document.getElementById('fAuthor').value, locations: pickedLocs });
  localStorage.setItem('litKarte_v1', JSON.stringify(books));
  pickedLocs = []; switchTab('list'); renderAllMarkers();
}

function deleteBook(id) {
  books = books.filter(b => b.id !== id);
  localStorage.setItem('litKarte_v1', JSON.stringify(books));
  renderAllMarkers(); renderSidebar();
}

function zoomTo(id) {
  const b = books.find(x => x.id === id);
  if (b) map.flyTo([b.locations[0].lat, b.locations[0].lng], 10);
}

function switchTab(t) { tab = t; renderSidebar(); document.getElementById('tab-list').classList.toggle('on', t==='list'); document.getElementById('tab-add').classList.toggle('on', t==='add'); }

function exportData() {
  const blob = new Blob([JSON.stringify(books)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'literatur.json'; a.click();
}

function importData(e) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    books = JSON.parse(ev.target.result);
    localStorage.setItem('litKarte_v1', JSON.stringify(books));
    renderAllMarkers(); renderSidebar();
  };
  reader.readAsText(e.target.files[0]);
}

renderAllMarkers();
renderSidebar();
</script>
</body>
</html>
