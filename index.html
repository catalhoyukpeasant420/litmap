<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Literarische Karte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1208;
  --bg: #f7f5f2;
  --surface: #fff;
  --muted: #7a746f;
  --border: #e0dbd5;
  --accent: #c45a18;
  --radius: 8px;
  --sidebar: 320px;
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); font-size: 13px; }
#app { display: flex; flex-direction: column; height: 100vh; }

/* ── Toolbar ── */
#toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
#toolbar h1 { font-size: 15px; font-weight: 700; margin-right: auto; letter-spacing: -.02em; }
#toolbar h1 span { color: var(--accent); font-weight: 400; font-style: italic; }
.tbtn { font-size: 12px; padding: 5px 11px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; transition: background .12s; }
.tbtn:hover { background: var(--bg); }
#globalSearch { padding: 5px 10px; font-size: 12px; border: 1px solid var(--border); border-radius: var(--radius); width: 180px; background: var(--bg); outline: none; font-family: inherit; }
#globalSearch:focus { border-color: #aaa; background: #fff; }

/* ── Layout ── */
#main { display: flex; flex: 1; overflow: hidden; }
#sidebar { width: var(--sidebar); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
#tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab { flex: 1; padding: 9px 4px; text-align: center; cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; user-select: none; transition: color .15s; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
#panel { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px; }

/* ── Filter panel ── */
.filter-intro { font-size: 11px; color: var(--muted); line-height: 1.5; padding: 2px 0; }
.filter-block { border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.filter-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 11px; cursor: pointer; user-select: none; font-size: 12px; font-weight: 600; background: var(--bg); transition: background .12s; min-height: 36px; }
.filter-header:hover { background: #edeae4; }
.filter-header .fh-left { display: flex; align-items: center; gap: 5px; }
.filter-badge { font-size: 10px; color: var(--accent); font-weight: 700; }
.filter-header .arrow { font-size: 10px; color: var(--muted); transition: transform .2s; }
.filter-header.open .arrow { transform: rotate(180deg); }
.filter-body { padding: 0 10px 10px; display: none; background: var(--surface); }
.filter-body.open { display: block; }
.filter-scroll { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin-top: 7px; }
.cb-item { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; padding: 4px 3px; border-radius: 5px; }
.cb-item:hover { background: var(--bg); }
.cb-item input[type=checkbox] { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.cb-label { flex: 1; display: flex; align-items: center; gap: 5px; }
.cb-count { font-size: 10px; color: var(--muted); margin-left: auto; }
.filter-actions { display: flex; gap: 8px; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border); }
.filter-link { font-size: 11px; color: var(--accent); cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; }
.filter-link:hover { text-decoration: underline; }
.no-filter-items { font-size: 12px; color: var(--muted); padding: 8px 0; font-style: italic; }
.color-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; vertical-align: middle; }
.filter-status { font-size: 11px; color: var(--muted); min-height: 16px; }

/* ── Book list ── */
.section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 2px 1px 4px; border-bottom: 1px solid var(--border); }
.book-item { display: flex; gap: 8px; padding: 8px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); position: relative; transition: border-color .15s; }
.book-item:hover { border-color: #bbb; }
.book-item-inner { display: flex; gap: 8px; flex: 1; cursor: pointer; min-width: 0; }
.bthumb { width: 36px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); flex-shrink: 0; }
.bph { width: 36px; height: 50px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.bi { flex: 1; min-width: 0; padding-right: 40px; }
.bt { font-size: 13px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ba { font-size: 11px; color: var(--muted); margin-top: 1px; font-style: italic; }
.book-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; align-items: center; }
.tag-pill { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 2px 6px; font-size: 10px; }
.transport-pill { border-radius: 10px; padding: 2px 7px; font-size: 10px; background: #eef4ff; border: 1px solid #c8d8f0; color: #1a4080; }
.loc-count { font-size: 10px; color: var(--muted); }
.book-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 5px; }
.editbtn, .delbtn { background: none; border: none; cursor: pointer; font-size: 13px; color: #ccc; padding: 0; line-height: 1; transition: color .15s; }
.editbtn:hover { color: var(--accent); }
.delbtn:hover { color: #c00; }
.empty { text-align: center; padding: 28px 10px; color: var(--muted); font-size: 13px; line-height: 1.7; }
.dimmed { opacity: .38; }

/* ── Form ── */
.fg { display: flex; flex-direction: column; gap: 4px; }
.lbl { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
input[type=text], input[type=url], textarea, select {
  width: 100%; font-size: 13px; padding: 6px 8px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg); color: var(--ink);
  outline: none; font-family: inherit; transition: border-color .15s, background .15s;
}
input:focus, textarea:focus, select:focus { border-color: #aaa; background: #fff; }
textarea { resize: vertical; min-height: 50px; line-height: 1.5; }
.row2 { display: flex; gap: 8px; }
.row2 > * { flex: 1; min-width: 0; }

/* Cover */
.cover-area { display: flex; flex-direction: column; gap: 5px; }
.cover-drop { border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; font-size: 12px; color: var(--muted); background: var(--bg); transition: border-color .15s, background .15s; display: flex; align-items: center; gap: 10px; }
.cover-drop:hover, .cover-drop.drag-over { border-color: var(--accent); background: #fdf3ec; }
.cover-drop img { height: 64px; width: auto; max-width: 50px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); flex-shrink: 0; }
.cover-drop-text { flex: 1; }
.cover-drop-text small { display: block; font-size: 10px; color: var(--muted); margin-top: 1px; }

/* Tags */
.tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
.tag-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 3px 8px 3px 9px; font-size: 11px; }
.tag-chip button { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 13px; line-height: 1; padding: 0; }
.tag-chip button:hover { color: #c00; }
.preset-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.preset-tag { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 2px 8px; font-size: 11px; cursor: pointer; transition: background .12s; color: var(--muted); }
.preset-tag:hover { background: #eee; color: var(--ink); }
.tag-add-row { display: flex; gap: 5px; }
.tag-add-row input { flex: 1; }
.tag-add-row button { padding: 6px 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: 13px; font-family: inherit; transition: background .12s; flex-shrink: 0; }
.tag-add-row button:hover { background: #eee; }

.hint { font-size: 12px; padding: 7px 10px; border-radius: var(--radius); background: #fffbea; color: #856404; border: 1px solid #f0e060; text-align: center; }

/* Orte */
.ort-item { margin-top: 5px; }
.ploc { display: flex; align-items: flex-start; gap: 6px; padding: 6px 7px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); }
.ploc-idx { width: 20px; height: 20px; border-radius: 50%; background: var(--muted); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
.ploc-draggable { cursor: grab; }
.ploc-draggable:active { cursor: grabbing; }
.ploc-fields { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ploc-fields input { font-size: 12px; padding: 4px 6px; }
.rm { background: none; border: none; cursor: pointer; font-size: 16px; color: var(--muted); padding: 0 2px; line-height: 1; flex-shrink: 0; margin-top: 1px; transition: color .15s; }
.rm:hover { color: #c00; }
.conn-row { display: flex; align-items: center; gap: 7px; padding: 3px 8px 3px 33px; font-size: 11px; color: var(--muted); border-left: 2px solid var(--border); margin-left: 10px; }
.conn-row input[type=checkbox] { width: auto; padding: 0; accent-color: var(--accent); }
.conn-transport { flex: 1; font-size: 11px; padding: 3px 6px; margin-left: 4px; }

.save-btn { width: 100%; padding: 9px; font-size: 14px; font-weight: 600; border-radius: var(--radius); border: none; background: var(--ink); color: #fff; cursor: pointer; margin-top: 4px; transition: opacity .15s; font-family: inherit; }
.save-btn:hover { opacity: .82; }
.cancel-btn { width: 100%; padding: 7px; font-size: 13px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--ink); cursor: pointer; margin-top: 4px; font-family: inherit; }
.add-loc-btn { width: 100%; padding: 7px; font-size: 12px; margin-top: 6px; border-radius: var(--radius); border: 1px dashed var(--border); background: var(--bg); cursor: pointer; color: var(--ink); font-family: inherit; transition: background .12s; }
.add-loc-btn:hover { background: #eee; }

/* ── Map ── */
#mapwrap { flex: 1; position: relative; }
#map { width: 100%; height: 100%; }

/* ── Leaflet popup ── */
.lpopup { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 200px; }
.lpopup-cover { width: 100%; display: block; border-radius: 6px; margin-bottom: 9px; border: 1px solid var(--border); }
.lpopup .pt { font-size: 14px; font-weight: 600; line-height: 1.3; }
.lpopup .pa { font-size: 11px; color: #888; font-style: italic; margin-top: 2px; }
.lpopup .pn { font-size: 11px; color: #999; margin-top: 5px; }
.lpopup .pd { font-size: 11px; color: #555; margin-top: 5px; border-top: 1px solid #eee; padding-top: 5px; line-height: 1.5; }
.lpopup-edit { display: inline-block; margin-top: 8px; font-size: 11px; color: var(--accent); cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; }
.lpopup-edit:hover { text-decoration: underline; }
.leaflet-popup-content-wrapper { border-radius: 10px !important; box-shadow: 0 4px 20px rgba(0,0,0,.13) !important; border: 1px solid var(--border) !important; }
.leaflet-popup-content { margin: 14px 15px !important; }

/* ── Hover tooltip ── */
.mtt { position: fixed; background: var(--ink); color: #fff; border-radius: 6px; padding: 4px 9px; font-size: 11px; z-index: 10000; pointer-events: none; white-space: nowrap; opacity: 0; transition: opacity .1s; }

/* ── Drag highlight ── */
.dragging-marker { cursor: grabbing !important; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>Literarische <span>Karte</span></h1>
    <input type="text" id="globalSearch" placeholder="🔍 Suchen …" oninput="handleSearch()">
    <button class="tbtn" onclick="exportData()">↓ Export</button>
    <label class="tbtn">↑ Import<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
  </div>
  <div id="main">
    <div id="sidebar">
      <div id="tabs">
        <div class="tab on"  id="tab-list"   onclick="switchTab('list')">Bücher</div>
        <div class="tab"     id="tab-filter" onclick="switchTab('filter')">Sichtbarkeit</div>
        <div class="tab"     id="tab-add"    onclick="switchTab('add')">+ Neu</div>
      </div>
      <div id="panel"></div>
    </div>
    <div id="mapwrap"><div id="map"></div></div>
  </div>
</div>
<div id="mtt" class="mtt"></div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const COLORS = ['#c45a18','#1a9e6a','#1a65b8','#9e1a5a','#6a8e1a','#7a3ab8','#c4881a','#1a8e9e','#8e3a1a','#1a5a8e'];
const PRESET_TAGS = ['Roman','Krimi','Thriller','Science-Fiction','Fantasy','Historisch','Biographie','Reisebericht','Gedichte','Essays','Märchen','Kinder'];
const TRANSPORT_OPTIONS = [
  { value:'',          label:'— keins —' },
  { value:'zu_fuss',   label:'🚶 Zu Fuß' },
  { value:'pferd',     label:'🐴 Pferd' },
  { value:'kutsche',   label:'🪄 Kutsche' },
  { value:'fahrrad',   label:'🚲 Fahrrad' },
  { value:'auto',      label:'🚗 Auto' },
  { value:'bahn',      label:'🚂 Bahn/Zug' },
  { value:'schiff',    label:'⛵ Schiff/Boot' },
  { value:'flugzeug',  label:'✈️ Flugzeug' },
  { value:'sonstiges', label:'🔀 Sonstiges' },
];

// ── Map ───────────────────────────────────────────────────────────────────────
const map = L.map('map', { center: [48.5, 11.0], zoom: 6 });
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

// ── State ─────────────────────────────────────────────────────────────────────
let books = [];
try { books = JSON.parse(localStorage.getItem('litKarte7') || '[]'); } catch {}

let tab = 'list';
let picking = false, pickedLocs = [], connections = {};
let fTitle='', fAuthor='', fDesc='', fCover='', fTags=[], editId=null;
let searchQuery = '';

// visFilter: null = no restriction (all visible); Set = which values are checked (visible)
const visFilter = { titles: null, authors: null, tags: null, transports: null };
const fbOpen = { title: true, author: true, tags: false, transport: false };

const layers = {};     // bookId -> [L.layer, …]
let tempLayers = [];   // layers shown while editing

// ── Helpers ───────────────────────────────────────────────────────────────────
const esc  = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const escA = s => String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const persist = () => { try { localStorage.setItem('litKarte7', JSON.stringify(books)); } catch {} };

function bookColor(book) {
  const idx = books.findIndex(b => b.id === book.id);
  return COLORS[(idx < 0 ? books.length : idx) % COLORS.length];
}
function transportLabel(v) { return TRANSPORT_OPTIONS.find(t => t.value === v)?.label || ''; }
function allAuthors() {
  return [...new Set(books.map(b=>b.author).filter(Boolean))].sort((a,b) => {
    const lastName = n => n.trim().split(/\s+/).pop().toLowerCase();
    return lastName(a).localeCompare(lastName(b), 'de');
  });
}
function allTags()       { return [...new Set(books.flatMap(b=>b.tags||[]))].sort((a,b)=>a.localeCompare(b,'de')); }
function allTransports() { return [...new Set(books.map(b=>b.transport).filter(Boolean))]; }

// Count books per filter value
function countByAuthor(a)  { return books.filter(b=>b.author===a).length; }
function countByTag(t)     { return books.filter(b=>(b.tags||[]).includes(t)).length; }
function countByTransport(v) { return books.filter(b=>b.transport===v).length; }

// ── Visibility ────────────────────────────────────────────────────────────────
function isBookVisible(b) {
  const { titles, authors, tags, transports } = visFilter;
  if (titles     !== null && !titles.has(b.id))                          return false;
  if (authors    !== null && !authors.has(b.author||''))                 return false;
  if (tags       !== null && !(b.tags||[]).some(t => tags.has(t)))       return false;
  if (transports !== null && !transports.has(b.transport||''))           return false;
  return true;
}
function syncVisibility(id) {
  const b = books.find(b=>b.id===id);
  const vis = b ? isBookVisible(b) : false;
  (layers[id]||[]).forEach(l => vis ? map.addLayer(l) : map.removeLayer(l));
}
function syncAll() { books.forEach(b => syncVisibility(b.id)); }

function catAllValues(cat) {
  if (cat==='titles')     return books.map(b=>b.id);
  if (cat==='authors')    return allAuthors();
  if (cat==='tags')       return allTags();
  if (cat==='transports') return allTransports();
  return [];
}
function isChecked(cat, val) { return visFilter[cat]===null || visFilter[cat].has(val); }
function hiddenCount(cat) {
  if (visFilter[cat]===null) return 0;
  return catAllValues(cat).length - visFilter[cat].size;
}

function filterToggle(cat, val, checked) {
  if (visFilter[cat]===null) visFilter[cat] = new Set(catAllValues(cat));
  if      (val==='__all__')  visFilter[cat] = null;
  else if (val==='__none__') visFilter[cat] = new Set();
  else if (checked)          visFilter[cat].add(val);
  else                       visFilter[cat].delete(val);
  syncAll();
  if (tab==='filter') renderFilter();
  if (tab==='list')   renderList();
}
window.filterToggle = filterToggle;

function resetAllFilters() {
  visFilter.titles=null; visFilter.authors=null; visFilter.tags=null; visFilter.transports=null;
  syncAll(); renderPanel();
}

// Ensure a new book is visible (add its id to any active title filter)
function ensureVisible(bookId) {
  if (visFilter.titles !== null) visFilter.titles.add(bookId);
}

// ── Icons ─────────────────────────────────────────────────────────────────────
function mkIcon(color) {
  return L.divIcon({
    className: '',
    html: `<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="${color}" stroke="white" stroke-width="1.5"/></svg>`,
    iconSize:[12,12], iconAnchor:[6,6], popupAnchor:[0,-9]
  });
}
function mkTempIcon(n) {
  return L.divIcon({
    className: '',
    html: `<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="#5580aa" stroke="white" stroke-width="1.5"/><text x="10" y="13.5" text-anchor="middle" font-size="9" fill="white" font-family="sans-serif" font-weight="700">${n}</text></svg>`,
    iconSize:[20,20], iconAnchor:[10,10], popupAnchor:[0,-12]
  });
}

// ── Popup HTML ────────────────────────────────────────────────────────────────
function buildPopup(book, loc) {
  return `<div class="lpopup">
    ${book.cover ? `<img class="lpopup-cover" src="${book.cover}" alt="Cover">` : ''}
    <div class="pt">${esc(book.title)}</div>
    ${book.author     ? `<div class="pa">${esc(book.author)}</div>` : ''}
    ${loc.name        ? `<div class="pn">📍 ${esc(loc.name)}</div>` : ''}
    ${loc.description ? `<div class="pd">${esc(loc.description)}</div>` : ''}
    ${book.description? `<div class="pd">${esc(book.description)}</div>` : ''}
    <button class="lpopup-edit" onclick="editBook('${book.id}');map.closePopup()">✎ Bearbeiten</button>
  </div>`;
}

// ── Render book on map ────────────────────────────────────────────────────────
function renderBook(book) {
  (layers[book.id]||[]).forEach(l => map.removeLayer(l));
  layers[book.id] = [];
  if (!book.locations?.length) return;
  const color = bookColor(book);
  const locs  = book.locations.map(l => [l.lat, l.lng]);
  const conns = book.connections || {};

  // Lines between locations (with per-connection transport label as tooltip)
  for (let i = 0; i < locs.length - 1; i++) {
    const conn = conns[`${i}-${i+1}`];
    if (conn?.active !== false) {
      const line = L.polyline([locs[i], locs[i+1]], { color, weight:2.5, opacity:.7, dashArray:'6,4' }).addTo(map);
      if (conn?.transport) {
        const tl = transportLabel(conn.transport);
        if (tl) line.bindTooltip(tl, { permanent:false, direction:'center', className:'leaflet-tooltip-transport' });
      }
      layers[book.id].push(line);
    }
  }

  // Markers
  book.locations.forEach(loc => {
    const m = L.marker([loc.lat, loc.lng], { icon: mkIcon(color) }).addTo(map);
    m.bindPopup(buildPopup(book, loc), { maxWidth: 240 });
    m.on('mouseover', e => showTT(book.title, e.originalEvent));
    m.on('mouseout', hideTT);
    layers[book.id].push(m);
  });
  syncVisibility(book.id);
}
function renderAllBooks() { books.forEach(renderBook); }

// ── Hover tooltip ─────────────────────────────────────────────────────────────
const mtt = document.getElementById('mtt');
function showTT(text, e) { mtt.textContent=text; mtt.style.left=(e.clientX+14)+'px'; mtt.style.top=(e.clientY+14)+'px'; mtt.style.opacity='1'; }
function hideTT() { mtt.style.opacity='0'; }

// ── FlyTo ─────────────────────────────────────────────────────────────────────
function flyToBook(id) {
  const b = books.find(b=>b.id===id); if (!b?.locations.length) return;
  const lls = b.locations.map(l=>[l.lat,l.lng]);
  lls.length===1 ? map.flyTo(lls[0],11,{duration:1}) : map.flyToBounds(L.latLngBounds(lls).pad(.3),{duration:1});
}

// ── Map click (picking) ───────────────────────────────────────────────────────
map.on('click', e => {
  if (!picking) return;
  const i = pickedLocs.length;
  pickedLocs.push({ lat:e.latlng.lat, lng:e.latlng.lng, name:'', description:'' });
  if (i > 0) connections[`${i-1}-${i}`] = { active:true, transport:'' };
  drawTempMarkers(); renderForm();
});

// ── Temp markers ──────────────────────────────────────────────────────────────
function drawTempMarkers() {
  tempLayers.forEach(l => map.removeLayer(l)); tempLayers = [];
  const locs = pickedLocs.map(l=>[l.lat,l.lng]);
  for (let i=0; i<locs.length-1; i++) {
    if (connections[`${i}-${i+1}`]?.active !== false)
      tempLayers.push(L.polyline([locs[i],locs[i+1]],{color:'#5580aa',weight:2.5,opacity:.7,dashArray:'6,4'}).addTo(map));
  }
  pickedLocs.forEach((loc,i) => {
    const m = L.marker([loc.lat,loc.lng], { icon:mkTempIcon(i+1), draggable:true }).addTo(map);
    m.on('dragend', e => {
      pickedLocs[i].lat = e.target.getLatLng().lat;
      pickedLocs[i].lng = e.target.getLatLng().lng;
      drawTempMarkers(); renderForm();
    });
    tempLayers.push(m);
  });
}

// ── Search ────────────────────────────────────────────────────────────────────
function handleSearch() { searchQuery = document.getElementById('globalSearch')?.value||''; renderList(); }
function bookMatchesSearch(b) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return [b.title,b.author,b.description,...(b.tags||[])].filter(Boolean).some(s=>s.toLowerCase().includes(q));
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(t) {
  tab = t;
  ['list','filter','add'].forEach(id => document.getElementById('tab-'+id).className='tab'+(t===id?' on':''));
  if (t==='add' && !editId) resetForm();
  renderPanel();
}
function renderPanel() {
  if (tab==='list')   renderList();
  if (tab==='filter') renderFilter();
  if (tab==='add')    renderForm();
}

// ── Book list ─────────────────────────────────────────────────────────────────
function renderList() {
  const panel = document.getElementById('panel'); if (tab!=='list') return;
  const all = books.filter(bookMatchesSearch);
  if (!all.length) {
    panel.innerHTML = `<div class="empty">${books.length ? 'Keine Treffer für „'+esc(searchQuery)+'".' : 'Noch keine Bücher.<br>Klicke auf „+ Neu".'}</div>`;
    return;
  }
  const visible = all.filter(isBookVisible);
  const hidden  = all.filter(b => !isBookVisible(b));
  let html = `<div class="section-label">Sichtbar (${visible.length})</div>`;
  html += visible.length ? visible.map(bookCardHTML).join('') : `<div class="empty" style="padding:10px 0;font-size:12px">Alle ausgeblendet.</div>`;
  if (hidden.length) {
    html += `<div class="section-label" style="margin-top:6px">Ausgeblendet (${hidden.length})</div>`;
    html += `<div class="dimmed">${hidden.map(bookCardHTML).join('')}</div>`;
  }
  panel.innerHTML = html;
}

function bookCardHTML(b) {
  const color = bookColor(b);
  const tLabel = transportLabel(b.transport);
  return `<div class="book-item">
    <div class="book-item-inner" onclick="flyToBook('${b.id}')">
      ${b.cover ? `<img class="bthumb" src="${b.cover}" alt="">` : `<div class="bph">📖</div>`}
      <div class="bi">
        <div class="bt"><span class="color-dot" style="background:${color};margin-right:5px"></span>${esc(b.title)}</div>
        ${b.author ? `<div class="ba">${esc(b.author)}</div>` : ''}
        <div class="book-meta">
          ${(b.tags||[]).map(t=>`<span class="tag-pill">#${esc(t)}</span>`).join('')}
          ${tLabel ? `<span class="transport-pill">${tLabel}</span>` : ''}
          <span class="loc-count">${b.locations.length} Ort${b.locations.length!==1?'e':''}</span>
        </div>
      </div>
    </div>
    <div class="book-actions">
      <button class="editbtn" title="Bearbeiten" onclick="event.stopPropagation();editBook('${b.id}')">✎</button>
      <button class="delbtn"  title="Löschen"    onclick="event.stopPropagation();deleteBook('${b.id}')">×</button>
    </div>
  </div>`;
}

// ── Filter panel ──────────────────────────────────────────────────────────────
function renderFilter() {
  const panel = document.getElementById('panel'); if (tab!=='filter') return;
  const anyHidden = ['titles','authors','tags','transports'].some(c => hiddenCount(c) > 0);
  const visibleCount = books.filter(isBookVisible).length;

  panel.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;min-height:20px">
      <span class="filter-intro">Häkchen = auf der Karte <strong>sichtbar</strong></span>
      ${anyHidden ? `<button class="filter-link" onclick="resetAllFilters()">Alle einblenden</button>` : ''}
    </div>
    <div class="filter-status">${anyHidden ? `${visibleCount} von ${books.length} Buch${books.length!==1?'ern':''} sichtbar` : ''}</div>
    ${filterBlock('title',     '📖 Titel',          books.map(b=>({val:b.id, lbl:b.title, color:bookColor(b), count:1})),   'titles')}
    ${filterBlock('author',    '✍️ Autor',           allAuthors().map(a=>({val:a, lbl:a, count:countByAuthor(a)})),          'authors')}
    ${filterBlock('tags',      '🏷️ Tags',            allTags().map(t=>({val:t, lbl:'#'+t, count:countByTag(t)})),           'tags')}
    ${filterBlock('transport', '🚗 Transportmittel', TRANSPORT_OPTIONS.filter(t=>t.value&&allTransports().includes(t.value)).map(t=>({val:t.value,lbl:t.label,count:countByTransport(t.value)})), 'transports')}
  `;
}

function filterBlock(id, label, items, cat) {
  const open = fbOpen[id];
  const hc   = hiddenCount(cat);
  return `<div class="filter-block">
    <div class="filter-header ${open?'open':''}" onclick="toggleFB('${id}')">
      <div class="fh-left">
        <span>${label}</span>
        ${hc ? `<span class="filter-badge">${hc} ×</span>` : ''}
      </div>
      <span class="arrow">▼</span>
    </div>
    <div class="filter-body ${open?'open':''}">
      ${items.length===0 ? `<div class="no-filter-items">Keine Einträge.</div>` : `
      <div class="filter-scroll">
        ${items.map(item => `
          <label class="cb-item">
            <input type="checkbox" ${isChecked(cat,item.val)?'checked':''}
              onchange="filterToggle('${cat}','${escA(item.val)}',this.checked)">
            <span class="cb-label">
              ${item.color?`<span class="color-dot" style="background:${item.color}"></span>`:''}
              ${esc(item.lbl)}
            </span>
            <span class="cb-count">${item.count}</span>
          </label>`).join('')}
      </div>
      <div class="filter-actions">
        <button class="filter-link" onclick="filterToggle('${cat}','__all__',true)">Alle</button>
        <button class="filter-link" onclick="filterToggle('${cat}','__none__',false)">Keine</button>
      </div>`}
    </div>
  </div>`;
}

function toggleFB(id) { fbOpen[id]=!fbOpen[id]; renderFilter(); }

// ── Form ──────────────────────────────────────────────────────────────────────
function renderForm() {
  const panel = document.getElementById('panel'); if (tab!=='add') return;

  const orteHtml = pickedLocs.length===0
    ? `<div style="color:var(--muted);font-size:12px;padding:4px 0">Noch keine Orte gesetzt.</div>`
    : pickedLocs.map((loc,i) => {
        const conn = connections[`${i}-${i+1}`];
        const hasNext = i < pickedLocs.length - 1;
        return `<div class="ort-item">
          <div class="ploc">
            <span class="ploc-idx ploc-draggable" title="Ziehen zum Verschieben auf der Karte">${i+1}</span>
            <div class="ploc-fields">
              <input type="text" value="${esc(loc.name)}" placeholder="Ortsname (optional)"
                onchange="pickedLocs[${i}].name=this.value">
              <input type="text" value="${esc(loc.description)}" placeholder="Beschreibung (optional)"
                onchange="pickedLocs[${i}].description=this.value">
            </div>
            <button class="rm" onclick="removeLoc(${i})">×</button>
          </div>
          ${hasNext ? `<div class="conn-row">
            <input type="checkbox" ${conn?.active!==false?'checked':''} onchange="toggleConn(${i})">
            <label>Linie zu Ort ${i+2}</label>
            <select class="conn-transport" onchange="setConnTransport(${i},this.value)">
              ${TRANSPORT_OPTIONS.map(t=>`<option value="${t.value}"${(conn?.transport||'')=== t.value?' selected':''}>${t.label}</option>`).join('')}
            </select>
          </div>` : ''}
        </div>`;
      }).join('');

  panel.innerHTML = `
    <div style="font-size:13px;font-weight:700">${editId?'Buch bearbeiten':'Neues Buch'}</div>

    <div class="fg">
      <div class="lbl">Titel *</div>
      <input type="text" id="fT" value="${esc(fTitle)}" placeholder="Buchtitel" oninput="fTitle=this.value">
    </div>
    <div class="fg">
      <div class="lbl">Autor/in</div>
      <input type="text" id="fA" value="${esc(fAuthor)}" placeholder="Verfasser/in" oninput="fAuthor=this.value">
    </div>
    <div class="fg">
      <div class="lbl">Beschreibung</div>
      <textarea id="fD" rows="2" placeholder="Kurzbeschreibung oder Notiz">${esc(fDesc)}</textarea>
    </div>

    <div class="fg">
      <div class="lbl">Tags</div>
      <div class="tag-row" id="tagRow">
        ${fTags.map(t=>`<span class="tag-chip">#${esc(t)}<button type="button" onclick="removeTag('${escA(t)}')">×</button></span>`).join('')}
      </div>
      <div class="preset-tags" style="margin-top:5px">
        ${PRESET_TAGS.map(t=>`<span class="preset-tag" onclick="addTagVal('${escA(t)}')">#${esc(t)}</span>`).join('')}
      </div>
      <div class="tag-add-row" style="margin-top:5px">
        <input type="text" id="newTag" placeholder="Eigener Tag …"
          onkeydown="if(event.key==='Enter'){addTagFromInput(true);event.preventDefault();}">
        <button type="button" onclick="addTagFromInput(false)">+</button>
      </div>
    </div>

    <div class="fg">
      <div class="lbl">Cover-Bild</div>
      <div class="cover-area" id="coverArea">
        <label class="cover-drop" id="coverDrop"
          ondragover="event.preventDefault();this.classList.add('drag-over')"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="handleCoverDrop(event)">
          ${fCover ? `<img src="${fCover}" alt="Cover">` : ''}
          <div class="cover-drop-text">
            <span>${fCover ? '✓ Cover vorhanden' : '📷 Hochladen oder einfügen'}</span>
            <small>${fCover ? 'Klicken zum Ändern' : 'Klicken · Drag &amp; Drop · Strg+V'}</small>
          </div>
          <input type="file" accept="image/*" onchange="handleCoverFile(event)" style="display:none">
        </label>
        <input type="url" id="fUrl" value="${fCover.startsWith('data:')?'':esc(fCover)}"
          placeholder="…oder Bild-URL"
          oninput="fCover=this.value;rerenderCoverPreview()">
      </div>
    </div>

    <div class="fg">
      <div class="lbl">Spielorte <span style="font-weight:400;text-transform:none;font-size:11px;color:var(--muted)">(Karte anklicken · Punkte verschiebbar)</span></div>
      ${picking ? '<div class="hint">🗺 Klicke auf die Karte – Escape zum Beenden</div>' : ''}
      ${orteHtml}
      <button class="add-loc-btn" onclick="startPicking()">
        ${picking ? '⏳ Warte auf Klick …' : '+ Ort auf Karte setzen'}
      </button>
    </div>

    <button class="save-btn" onclick="saveBook()">Buch speichern</button>
    ${editId ? `<button class="cancel-btn" onclick="cancelEdit()">Abbrechen</button>` : ''}
  `;

  // Attach paste handler to cover drop area
  document.getElementById('coverDrop')?.addEventListener('paste', handleCoverPaste);
}

// ── Cover helpers ─────────────────────────────────────────────────────────────
function rerenderCoverPreview() {
  const drop = document.getElementById('coverDrop');
  if (!drop) return;
  const url = document.getElementById('fUrl')?.value || '';
  fCover = url;
  const img = drop.querySelector('img');
  const txt = drop.querySelector('.cover-drop-text span');
  if (url) {
    if (!img) {
      const i = document.createElement('img'); i.src=url; i.alt='Cover';
      drop.insertBefore(i, drop.querySelector('.cover-drop-text'));
    } else { img.src=url; }
    if (txt) txt.textContent = '✓ Cover vorhanden';
  } else {
    img?.remove();
    if (txt) txt.textContent = '📷 Hochladen oder einfügen';
  }
}

function handleCoverFile(e) {
  const f = e.target.files[0]; if (!f) return;
  readCoverFile(f);
}
function handleCoverDrop(e) {
  e.preventDefault();
  document.getElementById('coverDrop')?.classList.remove('drag-over');
  const f = e.dataTransfer.files[0]; if (!f || !f.type.startsWith('image/')) return;
  readCoverFile(f);
}
function handleCoverPaste(e) {
  const items = e.clipboardData?.items; if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      readCoverFile(item.getAsFile());
      return;
    }
  }
}
function readCoverFile(f) {
  const r = new FileReader();
  r.onload = ev => { fCover = ev.target.result; renderForm(); };
  r.readAsDataURL(f);
}

// Global paste listener (works anywhere when on add tab)
document.addEventListener('paste', e => {
  if (tab !== 'add') return;
  const items = e.clipboardData?.items; if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      readCoverFile(item.getAsFile());
      return;
    }
  }
});

// ── Form actions ──────────────────────────────────────────────────────────────
function addTagVal(t) { if (t && !fTags.includes(t)) { fTags.push(t); renderForm(); } }
function addTagFromInput(keepFocus) {
  const inp = document.getElementById('newTag');
  if (!inp) return;
  const t = inp.value.trim();
  if (t && !fTags.includes(t)) fTags.push(t);
  inp.value = '';
  // Re-render only tags section, not full form, to keep focus
  const tagRow = document.getElementById('tagRow');
  if (tagRow) {
    tagRow.innerHTML = fTags.map(t=>`<span class="tag-chip">#${esc(t)}<button type="button" onclick="removeTag('${escA(t)}')">×</button></span>`).join('');
  }
  if (keepFocus) { setTimeout(() => document.getElementById('newTag')?.focus(), 0); }
}
function removeTag(t) { fTags=fTags.filter(x=>x!==t); renderForm(); }

function setConnTransport(i, val) {
  const k = `${i}-${i+1}`;
  if (!connections[k]) connections[k] = { active:true };
  connections[k].transport = val;
}

function removeLoc(i) {
  pickedLocs.splice(i, 1);
  const nc = {};
  for (let a=0; a<pickedLocs.length-1; a++) {
    const oa=a>=i?a+1:a, ob=a+1>=i?a+2:a+1;
    nc[`${a}-${a+1}`] = connections[`${oa}-${ob}`] ? {...connections[`${oa}-${ob}`]} : {active:true,transport:''};
  }
  Object.keys(connections).forEach(k=>delete connections[k]);
  Object.assign(connections, nc);
  drawTempMarkers(); renderForm();
}
function toggleConn(i) {
  const k = `${i}-${i+1}`;
  connections[k] = {...connections[k], active: connections[k]?.active===false};
  drawTempMarkers(); renderForm();
}
function startPicking() { picking=true; map.getContainer().style.cursor='crosshair'; renderForm(); }

function saveBook() {
  // Read latest field values
  fTitle  = document.getElementById('fT')?.value  ?? fTitle;
  fAuthor = document.getElementById('fA')?.value  ?? fAuthor;
  fDesc   = document.getElementById('fD')?.value  ?? fDesc;
  const urlEl = document.getElementById('fUrl');
  if (urlEl && !fCover.startsWith('data:')) fCover = urlEl.value;

  if (!fTitle.trim())    { alert('Bitte einen Titel eingeben.'); return; }
  if (!pickedLocs.length){ alert('Bitte mindestens einen Ort markieren.'); return; }

  const isNew = !editId;
  const id = editId || Date.now().toString();

  const book = {
    id,
    title:fTitle.trim(), author:fAuthor.trim(), description:fDesc.trim(),
    cover:fCover, tags:[...fTags],
    locations: pickedLocs.map(l=>({lat:l.lat, lng:l.lng, name:l.name||'', description:l.description||''})),
    connections: Object.fromEntries(Object.entries(connections).map(([k,v])=>[k,{...v}])),
    createdAt: editId ? (books.find(b=>b.id===editId)?.createdAt||Date.now()) : Date.now(),
  };

  const idx = books.findIndex(b=>b.id===id);
  if (idx>=0) books[idx]=book; else books.push(book);

  if (isNew) ensureVisible(id); // make sure it shows on map

  persist();
  renderBook(book);
  tempLayers.forEach(l=>map.removeLayer(l)); tempLayers=[];
  resetForm(); switchTab('list');
}

function resetForm() {
  editId=null; fTitle=''; fAuthor=''; fDesc=''; fCover=''; fTags=[];
  pickedLocs=[]; picking=false;
  Object.keys(connections).forEach(k=>delete connections[k]);
  map.getContainer().style.cursor='';
}
function cancelEdit() {
  tempLayers.forEach(l=>map.removeLayer(l)); tempLayers=[];
  resetForm(); switchTab('list');
}
function editBook(id) {
  const b = books.find(b=>b.id===id); if (!b) return;
  editId=b.id; fTitle=b.title; fAuthor=b.author||''; fDesc=b.description||'';
  fCover=b.cover||''; fTags=[...(b.tags||[])];
  pickedLocs = b.locations.map(l=>({...l}));
  Object.keys(connections).forEach(k=>delete connections[k]);
  for (const k in (b.connections||{})) connections[k]={...b.connections[k]};
  for (let i=0;i<pickedLocs.length-1;i++) if(!connections[`${i}-${i+1}`]) connections[`${i}-${i+1}`]={active:true,transport:''};
  picking=false; map.getContainer().style.cursor='';
  drawTempMarkers(); switchTab('add');
}
function deleteBook(id) {
  if (!confirm('Buch wirklich löschen?')) return;
  (layers[id]||[]).forEach(l=>map.removeLayer(l)); delete layers[id];
  books=books.filter(b=>b.id!==id);
  if (visFilter.titles!==null) visFilter.titles.delete(id);
  persist(); renderPanel();
}

// ── Export / Import ───────────────────────────────────────────────────────────
function exportData() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(books,null,2)],{type:'application/json'}));
  a.download='literarische-karte.json'; a.click();
}
function importData(e) {
  const f=e.target.files[0]; if (!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try {
      const imp=JSON.parse(ev.target.result);
      if(Array.isArray(imp)){
        Object.values(layers).flat().forEach(l=>map.removeLayer(l));
        Object.keys(layers).forEach(k=>delete layers[k]);
        books=imp; persist(); renderAllBooks(); renderPanel();
      }
    } catch { alert('Ungültige JSON-Datei.'); }
  };
  r.readAsText(f); e.target.value='';
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key==='Escape' && picking) { picking=false; map.getContainer().style.cursor=''; renderForm(); }
});

// ── Init ──────────────────────────────────────────────────────────────────────
renderAllBooks();
renderList();
